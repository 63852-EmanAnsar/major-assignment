<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — StudyFlow</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-brand">
    <!-- NAYA BADA LOGO -->
    <div class="brand-logo">
      <img src="assets/study.jpg" alt="StudyFlow Logo" />
    </div>
    <h1>StudyFlow</h1>
    <p>Smart Study Planner</p>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login" type="button">Login</button>
      <button class="auth-tab" data-mode="register" type="button">Register</button>
    </div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Ali Khan" />
      </div>

      <div class="field" id="courseField" style="display:none">
        <label for="course">Course / Field</label>
        <input id="course" type="text" placeholder="Computer Science" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 6 characters" required />
      </div>

      <button class="btn-primary" id="submitBtn" type="submit">Login</button>
      <p class="auth-msg" id="authMsg"></p>
    </form>
  </div>
</div>

<script>
let mode = 'login';
const form = document.getElementById('authForm');
const nameField = document.getElementById('nameField');
const courseField = document.getElementById('courseField');
const authMsg = document.getElementById('authMsg');

// Agar pehle se login hai toh direct dashboard khulega
if(localStorage.getItem('currentUser')) {
    location.href = 'index.html';
}

// Tab Switch Function
function switchTab(newMode) {
  document.querySelectorAll('.auth-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === newMode);
  });
  mode = newMode;
  const isReg = mode === 'register';
  nameField.style.display = isReg ? 'block' : 'none';
  courseField.style.display = isReg ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = isReg ? 'Create Account' : 'Login';
  authMsg.textContent = '';
}

document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.mode));
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  authMsg.textContent = '';
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  let users = JSON.parse(localStorage.getItem('users') || '[]');

  if (mode === 'register') {
    const name = document.getElementById('name').value.trim();
    const course = document.getElementById('course').value.trim() || 'Student';
    
    if (users.find(u => u.email === email)) {
      authMsg.style.color = '#ef4444';
      authMsg.textContent = 'Email already registered!';
      return;
    }
    
    // Database mein save karein
    const newUser = { name, email, password, course };
    users.push(newUser);
    localStorage.setItem('users', JSON.stringify(users));
    
    // Success Message aur wapis Login tab par bhejna
    authMsg.style.color = '#10b981';
    authMsg.textContent = 'Account created successfully! Please login.';
    
    setTimeout(() => {
      switchTab('login');
      document.getElementById('email').value = email; // email pehle se bhari hogi
      document.getElementById('password').value = ''; 
      authMsg.style.color = '#10b981';
      authMsg.textContent = 'Account created. Please login now.';
    }, 1500);

  } else {
    // Login Logic
    const user = users.find(u => u.email === email && u.password === password);
    if (!user) {
      authMsg.style.color = '#ef4444';
      authMsg.textContent = 'Wrong email or password!';
      return;
    }
    
    localStorage.setItem('currentUser', JSON.stringify(user));
    authMsg.style.color = '#10b981';
    authMsg.textContent = 'Login successful! Redirecting...';
    setTimeout(() => location.href = 'index.html', 800);
  }
});
</script>
</body>
</html>
